# Instalador para Windows: npm run dist → dist/proyecto-ingles-<versión>-setup.exe
appId: com.artemis18.proyectoingles
productName: Proyecto Inglés
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - resources/icon.png
  - resources/icons/*.png
  - '!**/*.map'
# El temario se lee desde los recursos de la app (process.resourcesPath/content).
# Los .ico van afuera del asar porque los accesos directos de Windows no pueden apuntar adentro.
extraResources:
  - from: content
    to: content
  - from: build/icons
    to: icons
asar: true
npmRebuild: false
# Ícono generado con npm run icon (build/icon.ico).
win:
  target: nsis
  icon: build/icon.ico
  artifactName: proyecto-ingles-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Proyecto Inglés
