# Instalador para Windows: npm run dist → dist/enhome-<versión>-setup.exe
appId: com.artemis18.enhome
productName: Enhome
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - resources/icon.png
  - resources/icons/*.png
  - '!**/*.map'
# El temario se lee desde los recursos de la app (process.resourcesPath/content).
# Los .ico van afuera del asar porque los accesos directos de Windows no pueden apuntar adentro.
extraResources:
  - from: content
    to: content
  - from: build/icons
    to: icons
asar: true
# El motor de voz es un módulo nativo con sus DLL: va afuera del asar.
asarUnpack:
  - '**/node_modules/sherpa-onnx-*/**'
npmRebuild: false
# Ícono generado con npm run icon (build/icon.ico).
win:
  target: nsis
  icon: build/icon.ico
  artifactName: enhome-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Enhome
# Fuses: la app instalada ignora ELECTRON_RUN_AS_NODE (la terminal de VS Code lo define y la
# hacía arrancar como Node), NODE_OPTIONS y los argumentos de depuración, y solo carga app.asar.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
